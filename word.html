<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word编辑器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: #f5f5f5;
            min-height: 100vh;
        }
        
        .word-editor {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: white;
        }
        
        .title-bar {
            background: #2b579a;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e3a68;
        }
        
        .title-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 25px;
            font-weight: bold;
        }
        
        .document-title {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            font-size: 16px;
            padding: 6px 12px;
            border-radius: 4px;
            min-width: 200px;
        }
        
        .save-status {
            font-size: 12px;
            color: #95a5a6;
        }
        
        .save-status.unsaved {
            color: #e74c3c;
        }
        
        .toolbar {
            background: #f8f9fa;
            padding: 8px 15px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        
        .tool-group {
            display: flex;
            padding-right: 15px;
            margin-right: 15px;
            border-right: 1px solid #dee2e6;
        }
        
        .tool-group:last-child {
            border-right: none;
        }
        
        .tool-btn {
            background: white;
            border: 1px solid #ced4da;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #495057;
            margin-right: 5px;
        }
        
        .tool-btn:hover {
            background: #e9ecef;
        }
        
        .tool-btn.active {
            background: #0078d4;
            color: white;
            border-color: #005a9e;
        }
        
        select {
            padding: 5px 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            background: white;
            color: #495057;
            font-size: 14px;
        }
        
        .color-picker {
            width: 30px;
            height: 30px;
            padding: 0;
            border: 1px solid #ced4da;
            cursor: pointer;
        }
        
        .editor-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        .document-pane {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .page {
            background: white;
            min-height: 100%;
            padding: 60px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border: 1px solid #dee2e6;
        }
        
        #editorContent {
            outline: none;
            min-height: 500px;
            line-height: 1.6;
            font-size: 16px;
        }
        
        #editorContent h1 {
            font-size: 24px;
            color: #2c3e50;
            margin: 20px 0 10px;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }
        
        #editorContent h2 {
            font-size: 20px;
            color: #34495e;
            margin: 15px 0 8px;
        }
        
        #editorContent h3 {
            font-size: 18px;
            color: #7f8c8d;
            margin: 12px 0 6px;
        }
        
        #editorContent p {
            margin: 10px 0;
        }
        
        #editorContent ul, #editorContent ol {
            margin: 10px 0 10px 25px;
        }
        
        #editorContent table {
            border-collapse: collapse;
            width: 100%;
            margin: 15px 0;
        }
        
        #editorContent table th, #editorContent table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        
        #editorContent table th {
            background: #f8f9fa;
        }
        
        .status-bar {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 5px 15px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow: hidden;
        }
        
        .modal-header {
            background: #2b579a;
            color: white;
            padding: 15px;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .modal-footer {
            padding: 15px;
            background: #f8f9fa;
            text-align: right;
            border-top: 1px solid #dee2e6;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn-primary {
            background: #0078d4;
            color: white;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-right: 10px;
        }
        
        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            margin: 10px 0;
        }
        
        @media (max-width: 768px) {
            .tool-btn span {
                display: none;
            }
            
            .page {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="word-editor">
        <div class="title-bar">
            <div class="title-left">
                <div class="logo">📝</div>
                <input type="text" class="document-title" id="docTitle" value="新文档" placeholder="文档标题">
            </div>
            <div class="save-status" id="saveStatus">已保存</div>
        </div>
        
        <div class="toolbar">
            <div class="tool-group">
                <button class="tool-btn" onclick="newDocument()">📄 新建</button>
                <button class="tool-btn" onclick="openFile()">📂 打开</button>
                <button class="tool-btn" onclick="saveDocument()">💾 保存</button>
                <button class="tool-btn" onclick="printDocument()">🖨️ 打印</button>
            </div>
            
            <div class="tool-group">
                <select id="fontFamily" onchange="formatText('fontName', this.value)">
                    <option value="Microsoft YaHei">微软雅黑</option>
                    <option value="SimSun">宋体</option>
                    <option value="SimHei">黑体</option>
                </select>
                
                <select id="fontSize" onchange="formatText('fontSize', this.value)">
                    <option value="1">小</option>
                    <option value="2">较小</option>
                    <option value="3" selected>标准</option>
                    <option value="4">中</option>
                    <option value="5">大</option>
                </select>
            </div>
            
            <div class="tool-group">
                <button class="tool-btn" onclick="formatText('bold')">B 粗体</button>
                <button class="tool-btn" onclick="formatText('italic')">I 斜体</button>
                <button class="tool-btn" onclick="formatText('underline')">U 下划线</button>
                <button class="tool-btn" onclick="formatText('strikeThrough')">S 删除线</button>
            </div>
            
            <div class="tool-group">
                <button class="tool-btn" onclick="formatText('justifyLeft')">☰ 左对齐</button>
                <button class="tool-btn" onclick="formatText('justifyCenter')">☰ 居中</button>
                <button class="tool-btn" onclick="formatText('justifyRight')">☰ 右对齐</button>
            </div>
            
            <div class="tool-group">
                <input type="color" class="color-picker" id="textColor" onchange="formatText('foreColor', this.value)" value="#000000">
                <input type="color" class="color-picker" id="bgColor" onchange="formatText('backColor', this.value)" value="#ffffff">
            </div>
            
            <div class="tool-group">
                <button class="tool-btn" onclick="insertTable()">⬜ 表格</button>
                <button class="tool-btn" onclick="insertImage()">🖼️ 图片</button>
                <button class="tool-btn" onclick="insertLink()">🔗 链接</button>
                <button class="tool-btn" onclick="insertList('ul')">• 列表</button>
            </div>
        </div>
        
        <div class="editor-container">
            <div class="document-pane">
                <div class="page">
                    <div id="editorContent" contenteditable="true">
                        <h1>欢迎使用Word编辑器</h1>
                        <p>这是一个完全在线的文档编辑器，可以直接在浏览器中使用。</p>
                        
                        <h2>基本功能</h2>
                        <ul>
                            <li>支持文本格式设置（粗体、斜体、下划线）</li>
                            <li>调整字体和字号</li>
                            <li>文字颜色和背景色</li>
                            <li>对齐方式设置</li>
                            <li>插入表格和图片</li>
                        </ul>
                        
                        <h2>使用方法</h2>
                        <p>1. 选择文本后点击工具栏按钮进行格式化</p>
                        <p>2. 点击"保存"按钮可将文档保存为HTML文件</p>
                        <p>3. 使用"打印"按钮可以直接打印文档</p>
                        
                        <h2>示例表格</h2>
                        <table>
                            <tr>
                                <th>功能</th>
                                <th>说明</th>
                                <th>状态</th>
                            </tr>
                            <tr>
                                <td>文本编辑</td>
                                <td>基础文字处理</td>
                                <td>✓ 可用</td>
                            </tr>
                            <tr>
                                <td>文件保存</td>
                                <td>导出为TXT文件</td>
                                <td>✓ 可用</td>
                            </tr>
                            <tr>
                                <td>打印功能</td>
                                <td>直接打印文档</td>
                                <td>✓ 可用</td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="status-bar">
            <div>字数: <span id="wordCount">0</span></div>
            <div>页面: 1</div>
        </div>
    </div>
    
    <div class="modal" id="linkModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>插入链接</h3>
            </div>
            <div class="modal-body">
                <input type="text" id="linkText" placeholder="链接文本">
                <input type="url" id="linkUrl" placeholder="链接地址">
                <label><input type="checkbox" id="newWindow"> 新窗口打开</label>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="insertLinkNow()">插入</button>
            </div>
        </div>
    </div>
    
    <script>
        let hasUnsavedChanges = false;
        let saveTimer = null;
        
        document.addEventListener('DOMContentLoaded', function() {
            updateWordCount();
            
            document.getElementById('editorContent').addEventListener('input', function() {
                hasUnsavedChanges = true;
                document.getElementById('saveStatus').textContent = '未保存';
                document.getElementById('saveStatus').className = 'save-status unsaved';
                
                clearTimeout(saveTimer);
                saveTimer = setTimeout(updateWordCount, 500);
            });
            
            document.getElementById('editorContent').addEventListener('paste', function(e) {
                e.preventDefault();
                const text = (e.clipboardData || window.clipboardData).getData('text');
                document.execCommand('insertText', false, text);
            });
        });
        
        function formatText(command, value) {
            if (command === 'bold' || command === 'italic' || command === 'underline') {
                const btn = event.target.closest('.tool-btn');
                if (btn) btn.classList.toggle('active');
            }
            
            if (value) {
                document.execCommand(command, false, value);
            } else {
                document.execCommand(command, false, null);
            }
            
            hasUnsavedChanges = true;
            updateWordCount();
        }
        
        function insertTable() {
            const rows = prompt('行数:', '3');
            const cols = prompt('列数:', '3');
            
            if (rows && cols) {
                let html = '<table border="1" style="border-collapse: collapse; width: 100%; margin: 10px 0;">';
                for (let i = 0; i < rows; i++) {
                    html += '<tr>';
                    for (let j = 0; j < cols; j++) {
                        html += '<td style="padding: 5px;">&nbsp;</td>';
                    }
                    html += '</tr>';
                }
                html += '</table>';
                document.execCommand('insertHTML', false, html);
            }
        }
        
        function insertImage() {
            const url = prompt('图片URL:', 'https://via.placeholder.com/400x200');
            if (url) {
                const html = `<img src="${url}" alt="图片" style="max-width: 100%; margin: 10px 0;">`;
                document.execCommand('insertHTML', false, html);
            }
        }
        
        function insertLink() {
            document.getElementById('linkModal').style.display = 'flex';
            document.getElementById('linkText').value = window.getSelection().toString();
        }
        
        function insertLinkNow() {
            const text = document.getElementById('linkText').value;
            const url = document.getElementById('linkUrl').value;
            const newWindow = document.getElementById('newWindow').checked;
            
            if (url) {
                const target = newWindow ? 'target="_blank"' : '';
                const html = `<a href="${url}" ${target} style="color: #0078d4;">${text || url}</a>`;
                document.execCommand('insertHTML', false, html);
                closeModal();
            }
        }
        
        function insertList(type) {
            if (type === 'ul') {
                document.execCommand('insertUnorderedList');
            }
        }
        
        function newDocument() {
            if (hasUnsavedChanges && !confirm('有未保存的更改，确定要新建吗？')) {
                return;
            }
            
            document.getElementById('docTitle').value = '新文档';
            document.getElementById('editorContent').innerHTML = `
                <h1>新文档</h1>
                <p>开始编辑您的新文档...</p>
            `;
            
            hasUnsavedChanges = false;
            document.getElementById('saveStatus').textContent = '已保存';
            document.getElementById('saveStatus').className = 'save-status';
            updateWordCount();
        }
        
        function openFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.txt,.html';
            
            input.onchange = function(e) {
                const file = e.target.files[0];
                const reader = new FileReader();
                
                reader.onload = function(event) {
                    document.getElementById('editorContent').innerHTML = event.target.result;
                    document.getElementById('docTitle').value = file.name.replace(/\.[^/.]+$/, "");
                    hasUnsavedChanges = false;
                    document.getElementById('saveStatus').textContent = '已保存';
                    document.getElementById('saveStatus').className = 'save-status';
                    updateWordCount();
                };
                
                reader.readAsText(file);
            };
            
            input.click();
        }
        
        function saveDocument() {
            const content = document.getElementById('editorContent').innerHTML;
            const title = document.getElementById('docTitle').value || '文档';
            
            const blob = new Blob([`<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>${title}</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; padding: 40px; line-height: 1.6; }
        h1, h2, h3 { color: #2c3e50; }
        table { border-collapse: collapse; width: 100%; margin: 15px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background: #f8f9fa; }
    </style>
</head>
<body>
    <h1>${title}</h1>
    ${content}
</body>
</html>`], {type: 'text/html'});
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${title}.html`;
            link.click();
            
            hasUnsavedChanges = false;
            document.getElementById('saveStatus').textContent = '已保存';
            document.getElementById('saveStatus').className = 'save-status';
        }
        
        function printDocument() {
            const content = document.getElementById('editorContent').innerHTML;
            const printWindow = window.open('', '_blank');
            
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>打印文档</title>
                    <style>
                        @media print {
                            body { font-family: 'Microsoft YaHei', sans-serif; padding: 20px; }
                            h1, h2, h3 { color: #000; }
                            table { border-collapse: collapse; width: 100%; }
                            th, td { border: 1px solid #000; padding: 8px; }
                        }
                    </style>
                </head>
                <body>
                    <h1>${document.getElementById('docTitle').value}</h1>
                    ${content}
                </body>
                </html>
            `);
            
            printWindow.document.close();
            printWindow.focus();
            setTimeout(() => {
                printWindow.print();
                printWindow.close();
            }, 500);
        }
        
        function updateWordCount() {
            const text = document.getElementById('editorContent').innerText;
            const words = text.trim().split(/\s+/).filter(word => word.length > 0);
            document.getElementById('wordCount').textContent = words.length;
        }
        
        function closeModal() {
            document.getElementById('linkModal').style.display = 'none';
            document.getElementById('linkText').value = '';
            document.getElementById('linkUrl').value = '';
        }
        
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveDocument();
            }
            if (e.ctrlKey && e.key === 'n') {
                e.preventDefault();
                newDocument();
            }
            if (e.ctrlKey && e.key === 'p') {
                e.preventDefault();
                printDocument();
            }
        });
        
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                closeModal();
            }
        };
    </script>
</body>
</html>
